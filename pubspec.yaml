name: first_flutter_project
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # Camera & Location
  camera: ^0.11.0
  location: ^5.0.3
  geocoding: ^5.0.0
  
  # Networking & Utilities
  http: ^1.3.0
  intl: ^0.20.2
  google_mlkit_image_labeling: ^0.15.0
  
  # Image Viewing
  photo_view: ^0.14.0
  
  # REMOVED: map_camera_flutter (causes overlay bug - replaced with native camera + location)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - images/complain.png
    - images/awarenessaction.png
    - images/primate.png
    - images/crocodiles.jpg
    - images/crocodile.png
